<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vở Ôn Tập IELTS — LongIELTS</title>
<style>
  :root{
    --paper:#FBF7EF;
    --paper-line:rgba(90,140,190,0.22);
    --margin-red:#B23B34;
    --ink:#2A241E;
    --ink-soft:#6B6154;
    --accent:#2B4C7E;
    --accent-soft:#E7EEF7;
    --amber:#B0740F;
    --amber-soft:#F7ECD6;
    --good:#2F7A4D;
    --good-soft:#E4F3E8;
    --bad:#C0392E;
    --bad-soft:#FBEAE7;
    --card-shadow: 0 1px 2px rgba(42,36,30,0.06), 0 8px 24px rgba(42,36,30,0.07);
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#1B2620;
      --paper-line:rgba(160,200,180,0.13);
      --margin-red:#C97A6B;
      --ink:#EDEAE0;
      --ink-soft:#AEBDB2;
      --accent:#8FC1D9;
      --accent-soft:#22343B;
      --amber:#E0B84A;
      --amber-soft:#3A3120;
      --good:#7FCB8E;
      --good-soft:#22392A;
      --bad:#E38176;
      --bad-soft:#3A2422;
      --card-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 28px rgba(0,0,0,0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B2620;
    --paper-line:rgba(160,200,180,0.13);
    --margin-red:#C97A6B;
    --ink:#EDEAE0;
    --ink-soft:#AEBDB2;
    --accent:#8FC1D9;
    --accent-soft:#22343B;
    --amber:#E0B84A;
    --amber-soft:#3A3120;
    --good:#7FCB8E;
    --good-soft:#22392A;
    --bad:#E38176;
    --bad-soft:#3A2422;
    --card-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 28px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --paper:#FBF7EF;
    --paper-line:rgba(90,140,190,0.22);
    --margin-red:#B23B34;
    --ink:#2A241E;
    --ink-soft:#6B6154;
    --accent:#2B4C7E;
    --accent-soft:#E7EEF7;
    --amber:#B0740F;
    --amber-soft:#F7ECD6;
    --good:#2F7A4D;
    --good-soft:#E4F3E8;
    --bad:#C0392E;
    --bad-soft:#FBEAE7;
    --card-shadow: 0 1px 2px rgba(42,36,30,0.06), 0 8px 24px rgba(42,36,30,0.07);
    color-scheme: light;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, color-mix(in srgb, var(--paper) 96%, var(--ink) 4%), var(--paper) 55%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Helvetica Neue",Arial,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .mono{font-family:ui-monospace,"Cascadia Code","SFMono-Regular",Consolas,Menlo,monospace;}

  .wrap{max-width:880px;margin:0 auto;padding:22px 18px 64px;}

  .topbar{
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    padding:6px 4px 18px;
    border-bottom:2px solid color-mix(in srgb, var(--ink) 12%, transparent);
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{
    font-size:30px;
    width:48px;height:48px;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);
    color:var(--accent);
    border-radius:50%;
  }
  .brand h1{
    font-size:1.5rem;margin:0 0 2px;letter-spacing:0.01em;
    text-wrap:balance;
  }
  .brand p{margin:0;color:var(--ink-soft);font-size:0.85rem;}
  .score-badge{
    font-family:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;
    font-size:0.95rem;font-weight:600;
    background:var(--amber-soft);color:var(--amber);
    padding:8px 14px;border-radius:999px;
    white-space:nowrap;
  }

  .back-pill{
    display:inline-flex;align-items:center;gap:6px;
    font-size:0.82rem;font-weight:700;padding:7px 14px;margin-bottom:12px;
    background:transparent;border:2px solid color-mix(in srgb, var(--ink) 18%, transparent);
    border-radius:999px;color:var(--ink-soft);cursor:pointer;
  }
  .back-pill:hover{color:var(--ink);border-color:var(--accent);}

  .tabs{
    display:flex;gap:6px;flex-wrap:wrap;
    margin-bottom:-2px;position:relative;z-index:1;
  }
  .tab{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",sans-serif;
    font-size:0.86rem;font-weight:600;
    color:var(--ink-soft);
    background:color-mix(in srgb, var(--paper) 80%, var(--ink) 6%);
    border:2px solid color-mix(in srgb, var(--ink) 12%, transparent);
    border-bottom:none;
    padding:9px 16px 11px;
    border-radius:10px 10px 0 0;
    cursor:pointer;
    transform:translateY(2px);
    transition:transform 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .tab:hover{color:var(--ink);}
  .tab.active{
    color:var(--accent);
    background:var(--paper);
    border-color:color-mix(in srgb, var(--ink) 12%, transparent);
    transform:translateY(0);
  }
  .tab:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:3px solid var(--accent);outline-offset:2px;
  }
  .tab.locked{opacity:0.45;cursor:not-allowed;}
  .tab-final.ready{color:var(--good);}
  .tab-final.ready.active{color:var(--good);border-color:color-mix(in srgb, var(--ink) 12%, transparent);}

  .page{
    position:relative;
    background:
      repeating-linear-gradient(var(--paper) 0 34px, var(--paper-line) 34px 35px, var(--paper) 35px 36px),
      var(--paper);
    border:2px solid color-mix(in srgb, var(--ink) 12%, transparent);
    border-radius:0 var(--radius) var(--radius) var(--radius);
    box-shadow:var(--card-shadow);
    min-height:420px;
    overflow:hidden;
  }
  .page.home{border-radius:var(--radius);}
  .page::before{
    content:"";
    position:absolute;top:0;bottom:0;left:46px;width:2px;
    background:var(--margin-red);opacity:0.55;
  }
  .page.home::before{content:none;}
  .page-inner{padding:28px 26px 30px 78px;}
  .page.home .page-inner{padding:28px 26px 30px 26px;}
  @media (max-width:600px){
    .page-inner{padding:22px 16px 26px 34px;}
    .page::before{left:18px;}
    .page.home .page-inner{padding:22px 16px 26px 16px;}
  }

  h2.section-title{
    font-weight:800;
    font-size:1.3rem;margin:0 0 4px;text-wrap:balance;
  }
  p.section-desc{margin:0 0 18px;color:var(--ink-soft);font-size:0.92rem;max-width:60ch;}

  .test-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:6px;}
  .test-card{
    position:relative;text-align:left;cursor:pointer;font:inherit;color:inherit;
    background:color-mix(in srgb, var(--paper) 90%, var(--ink) 10%);
    border:2px solid color-mix(in srgb, var(--ink) 14%, transparent);
    border-radius:12px;padding:18px 16px 16px;
    display:flex;flex-direction:column;gap:4px;
    transition:transform 0.15s ease, border-color 0.15s ease;
  }
  .test-card:not(.locked):hover{transform:translateY(-3px);border-color:var(--accent);}
  .test-card.locked{opacity:0.55;cursor:not-allowed;}
  .test-num{font-family:Georgia,"Iowan Old Style","Noto Serif",Cambria,serif;font-size:1.9rem;color:var(--accent);font-weight:700;line-height:1;}
  .test-sub{font-size:0.82rem;color:var(--ink-soft);margin:0;}
  .test-status{
    position:absolute;top:16px;right:16px;font-size:0.66rem;font-weight:700;text-transform:uppercase;
    letter-spacing:0.04em;padding:3px 9px;border-radius:999px;
  }
  .test-status.ready{background:var(--good-soft);color:var(--good);}
  .test-status.soon{background:color-mix(in srgb, var(--ink) 12%, transparent);color:var(--ink-soft);}

  .choose-hint{font-size:0.85rem;font-weight:700;color:var(--amber);margin:0 0 10px;}
  .chip-group{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .chip{
    font-size:0.84rem;font-weight:600;
    padding:7px 13px;border-radius:999px;
    border:2px solid color-mix(in srgb, var(--ink) 16%, transparent);
    background:transparent;color:var(--ink-soft);
    cursor:pointer;transition:all 0.15s ease;
  }
  .chip.selected{
    background:var(--accent);border-color:var(--accent);color:var(--paper);
  }

  .btn{
    font-family:inherit;font-size:0.92rem;font-weight:700;
    padding:11px 20px;border-radius:9px;border:2px solid transparent;
    cursor:pointer;transition:transform 0.1s ease, filter 0.15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent);color:var(--paper);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{opacity:0.45;cursor:not-allowed;}
  .btn-ghost{background:transparent;border-color:color-mix(in srgb, var(--ink) 22%, transparent);color:var(--ink);}
  .btn-ghost:hover{background:color-mix(in srgb, var(--ink) 6%, transparent);}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}

  .progress-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
  .progress-label{font-size:0.8rem;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .progress-track{flex:1;height:6px;border-radius:999px;background:color-mix(in srgb, var(--ink) 10%, transparent);overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);border-radius:999px;transition:width 0.3s ease;}

  .pos-tag{
    display:inline-block;font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;
    color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:6px;margin-bottom:10px;
  }
  .book-tag{color:var(--amber);background:var(--amber-soft);}

  .prompt-vn{
    font-weight:700;
    font-size:1.5rem;line-height:1.35;margin:0 0 18px;text-wrap:balance;
  }
  .prompt-word{
    font-family:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;
    font-size:1.7rem;font-weight:700;margin:0 0 18px;letter-spacing:0.01em;
  }
  .prompt-sentence{font-size:1.08rem;margin:0 0 18px;line-height:1.6;max-width:56ch;}
  .prompt-sentence .blank{
    font-family:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;
    background:var(--accent-soft);color:var(--accent);
    padding:1px 10px;border-radius:6px;font-weight:700;
  }

  .text-input{
    width:100%;max-width:420px;font-family:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;
    font-size:1.05rem;padding:12px 14px;border-radius:9px;
    border:2px solid color-mix(in srgb, var(--ink) 20%, transparent);
    background:color-mix(in srgb, var(--paper) 92%, var(--ink) 8%);
    color:var(--ink);
  }
  .text-input:disabled{opacity:0.75;}
  textarea.text-input{width:100%;max-width:none;min-height:78px;resize:vertical;font-family:inherit;font-size:1rem;}

  .mc-list{display:flex;flex-direction:column;gap:10px;max-width:520px;}
  .mc-opt{
    text-align:left;font-family:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;
    font-size:0.98rem;padding:12px 15px;border-radius:9px;
    border:2px solid color-mix(in srgb, var(--ink) 16%, transparent);
    background:color-mix(in srgb, var(--paper) 94%, var(--ink) 6%);
    color:var(--ink);cursor:pointer;transition:all 0.12s ease;
    display:flex;gap:10px;align-items:center;
  }
  .mc-opt:hover:not(:disabled){border-color:var(--accent);}
  .mc-opt .letter{font-weight:700;color:var(--ink-soft);}
  .mc-opt:disabled{cursor:default;}
  .mc-opt.correct{background:var(--good-soft);border-color:var(--good);color:var(--good);}
  .mc-opt.incorrect{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);}

  .feedback{
    margin-top:18px;padding:16px 18px;border-radius:10px;
    animation:rise 0.25s ease;
  }
  @media (prefers-reduced-motion:reduce){ .feedback{animation:none;} }
  @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .feedback.correct{background:var(--good-soft);border:2px solid color-mix(in srgb, var(--good) 45%, transparent);}
  .feedback.incorrect{background:var(--bad-soft);border:2px solid color-mix(in srgb, var(--bad) 45%, transparent);}
  .feedback-head{font-weight:800;font-size:1rem;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
  .feedback.correct .feedback-head{color:var(--good);}
  .feedback.incorrect .feedback-head{color:var(--bad);}
  .feedback-answer{font-family:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;font-weight:700;margin-bottom:6px;}
  .feedback-explain{font-size:0.94rem;color:var(--ink);opacity:0.92;line-height:1.55;}
  .speak-btn{
    margin-top:10px;font-size:0.82rem;font-weight:700;color:var(--accent);
    background:none;border:none;cursor:pointer;padding:4px 0;
  }

  .summary-score{
    font-weight:800;
    font-size:2.1rem;margin:0 0 4px;font-variant-numeric:tabular-nums;
  }
  .summary-list{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .summary-item{
    padding:12px 14px;border-radius:9px;background:color-mix(in srgb, var(--paper) 94%, var(--ink) 6%);
    border-left:4px solid var(--bad);font-size:0.92rem;
  }
  .summary-item b{font-family:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;}
  .summary-empty{color:var(--good);font-weight:600;}

  .cert{max-width:480px;margin:0 auto;text-align:center;padding:8px 0 4px;}
  .cert-stamp{
    width:72px;height:72px;margin:0 auto 14px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:34px;font-weight:800;color:var(--good);
    background:var(--good-soft);border:3px solid var(--good);
  }
  .cert-eyebrow{
    font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;
    color:var(--good);margin:0 0 6px;
  }
  .cert-title{font-weight:800;font-size:1.5rem;margin:0 0 4px;text-wrap:balance;}
  .cert-sub{color:var(--ink-soft);font-size:0.88rem;margin:0 0 22px;}
  .cert-name-label{display:block;font-size:0.82rem;font-weight:700;color:var(--ink-soft);margin:0 0 8px;text-align:left;}
  .cert .text-input{margin:0 auto 22px;text-align:left;}
  .cert-list{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:8px;text-align:left;}
  .cert-row{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;border-radius:9px;
    background:color-mix(in srgb, var(--paper) 94%, var(--ink) 6%);
    border:2px solid color-mix(in srgb, var(--good) 30%, transparent);
  }
  .cert-check{color:var(--good);font-weight:800;}
  .cert-label{flex:1;font-weight:600;font-size:0.92rem;}
  .cert-score{font-weight:700;color:var(--ink-soft);}
  .cert-total{font-size:1.3rem;font-weight:800;margin:0 0 4px;}
  .cert-date{color:var(--ink-soft);font-size:0.85rem;margin:0 0 18px;}
  .cert-instruction{
    font-size:0.94rem;font-weight:600;color:var(--amber);
    background:var(--amber-soft);padding:12px 16px;border-radius:10px;margin:0 0 20px;
  }
  .all-done-note{font-weight:700;color:var(--good);margin:18px 0 0;}

  footer.note{
    max-width:880px;margin:22px auto 0;padding:0 18px;
    color:var(--ink-soft);font-size:0.78rem;text-align:center;
  }

  @media (prefers-reduced-motion:reduce){ *{transition-duration:0.01ms !important;} }
</style>
</head>
<body>


<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">✎</span>
      <div>
        <h1 id="appTitle">Vở Ôn Tập IELTS</h1>
        <p id="appSubtitle">Chọn bài test bên dưới để bắt đầu ôn tập</p>
      </div>
    </div>
    <div class="score-badge" id="scoreBadge" style="display:none">0/0 câu đúng</div>
  </header>

  <div id="breadcrumbRow"></div>
  <nav class="tabs" id="tabs"></nav>
  <main class="page" id="pageWrap"><div class="page-inner" id="page"></div></main>
</div>
<footer class="note">Làm đến đâu chấm đến đó — sai không sao, quan trọng là nhớ được sau khi xem giải thích nhé!</footer>

function CT(){ return TESTS[currentTest]; }

function ensureTestState(testKey){
  if(sectionState[testKey]) return;
  var T = TESTS[testKey];
  sectionState[testKey] = {};
  SECTIONS.forEach(function(s){
    sectionState[testKey][s.key] = {
      phase:"setup",
      filters:{units:(T.units||[]).slice()},
      queue:[],idx:0,correct:0,wrong:[],checked:false,done:false
    };
  });
  testScore[testKey] = {correct:0,total:0};
}

function isTestComplete(testKey){
  return SECTIONS.every(function(s){ return sectionState[testKey][s.key].done; });
}

/* ---------------- HELPERS ---------------- */

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}
function normalize(s){
  return String(s).toLowerCase().normalize("NFC").replace(/[.,!?;:"'’()]/g,"").replace(/\s+/g," ").trim();
}
function stripTo(s){ return s.replace(/^to\s+/,""); }
function vocabCorrect(user,accepted){
  var u = normalize(user);
  if(!u) return false;
  var uNoTo = stripTo(u);
  return accepted.some(function(a){
    var an = normalize(a);
    return an===u || an===uNoTo || stripTo(an)===u || stripTo(an)===uNoTo;
  });
}
function escapeHtml(s){
  return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});
}
function speak(text){
  if(!("speechSynthesis" in window)) return;
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.92;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function letters(){ return ["A","B","C","D"]; }

function updateScoreBadge(){
  var badge = document.getElementById("scoreBadge");
  if(!currentTest){ badge.style.display="none"; return; }
  badge.style.display="";
  var sc = testScore[currentTest];
  badge.textContent = sc.correct+"/"+sc.total+" câu đúng";
}

/* ---------------- QUEUE BUILDERS ---------------- */

function buildQueue(key){
  var T = CT();
  var st = sectionState[currentTest][key];
  if(key==="vocab"){
    var pool = T.vocab.filter(function(v){ return st.filters.units.indexOf(v.unit)>-1; });
    return shuffle(pool).map(function(d){return {type:"vocab",data:d};});
  }
  if(key==="grammar"){
    return shuffle(T.grammar).map(function(d){return {type:"mc",data:d};});
  }
  if(key==="structure"){
    var pool2 = T.structure.filter(function(v){ return st.filters.units.indexOf(v.unit)>-1; });
    return shuffle(pool2).map(function(d){return {type:"mc",data:d};});
  }
  if(key==="phonetic"){
    var pool3 = T.phonetics.filter(function(v){ return st.filters.units.indexOf(v.unit)>-1; });
    return shuffle(pool3).map(function(d){
      var otherSyms = [];
      Object.keys(T.phonPools).forEach(function(u){ if(Number(u)!==d.unit) otherSyms = otherSyms.concat(T.phonPools[u]); });
      var distractors = shuffle(otherSyms).slice(0,3);
      var opts = shuffle([d.sym].concat(distractors));
      return {type:"phonetic",data:d,opts:opts,ans:opts.indexOf(d.sym)};
    });
  }
  if(key==="translate"){
    return shuffle(T.translation).map(function(d){return {type:"translate",data:d};});
  }
  return [];
}

/* ---------------- RENDER: TABS ---------------- */

function renderTabs(){
  var el = document.getElementById("tabs");
  if(!currentTest){ el.innerHTML = ""; return; }
  var allDone = isTestComplete(currentTest);
  var doneCount = SECTIONS.filter(function(s){ return sectionState[currentTest][s.key].done; }).length;
  var tabsHtml = SECTIONS.map(function(s){
    var done = sectionState[currentTest][s.key].done;
    return '<button class="tab'+(activeTab===s.key?" active":"")+'" data-tab="'+s.key+'">'+(done?"✓ ":"")+s.label+"</button>";
  }).join("");
  tabsHtml +=
    '<button class="tab tab-final'+(activeTab==="final"?" active":"")+(allDone?" ready":" locked")+'" data-tab="final"'+(allDone?"":" disabled")+'>'+
      "🎉 Hoàn Thành"+(allDone?"":" ("+doneCount+"/"+SECTIONS.length+")")+
    "</button>";
  el.innerHTML = tabsHtml;
  Array.prototype.forEach.call(el.querySelectorAll(".tab"),function(btn){
    btn.addEventListener("click",function(){
      activeTab = btn.getAttribute("data-tab");
      renderTabs();
      renderPage();
    });
  });
}

/* ---------------- RENDER: PAGE ---------------- */

function renderPage(){
  var pageWrap = document.getElementById("pageWrap");
  var page = document.getElementById("page");

  if(!currentTest){
    pageWrap.classList.add("home");
    page.innerHTML = homeHtml();
    bindHome();
    return;
  }
  pageWrap.classList.remove("home");

  if(activeTab==="final"){
    page.innerHTML = finalHtml();
    bindFinal();
    return;
  }

  var key = activeTab;
  var meta = SECTIONS.filter(function(s){return s.key===key;})[0];
  var st = sectionState[currentTest][key];

  if(st.phase==="setup"){ page.innerHTML = setupHtml(key,meta,st); bindSetup(key); return; }
  if(st.phase==="quiz"){ page.innerHTML = quizHtml(key,meta,st); bindQuiz(key); return; }
  if(st.phase==="summary"){ page.innerHTML = summaryHtml(key,meta,st); bindSummary(key); return; }
}

var UNIT_FILTER_SECTIONS = {vocab:true,structure:true,phonetic:true};

function setupHtml(key,meta,st){
  var T = CT();
  var unitPicker = "";
  if(UNIT_FILTER_SECTIONS[key]){
    unitPicker =
      '<p class="choose-hint">Hãy chọn (các) unit em muốn ôn rồi bấm “Bắt đầu” nhé!</p>'+
      '<div class="chip-group" id="unitChips">'+
        T.units.map(function(u){
          var sel = st.filters.units.indexOf(u)>-1;
          return '<button class="chip'+(sel?" selected":"")+'" data-val="'+u+'">'+T.unitLabel[u]+"</button>";
        }).join("")+
      "</div>";
  }
  var previewCount = buildQueue(key).length;
  return (
    '<h2 class="section-title">'+meta.label+"</h2>"+
    '<p class="section-desc">'+meta.desc+"</p>"+
    unitPicker+
    '<div class="btn-row">'+
      '<button class="btn btn-primary" id="startBtn"'+(previewCount===0?" disabled":"")+'>Bắt đầu ('+previewCount+" câu)</button>"+
    "</div>"
  );
}

function bindSetup(key){
  var st = sectionState[currentTest][key];
  var chipsWrap = document.getElementById("unitChips");
  if(chipsWrap){
    Array.prototype.forEach.call(chipsWrap.querySelectorAll(".chip"),function(chip){
      chip.addEventListener("click",function(){
        var val = Number(chip.getAttribute("data-val"));
        var arr = st.filters.units;
        var idx = arr.indexOf(val);
        if(idx>-1){ if(arr.length>1) arr.splice(idx,1); }
        else { arr.push(val); }
        renderPage();
      });
    });
  }
  var startBtn = document.getElementById("startBtn");
  if(startBtn){
    startBtn.addEventListener("click",function(){
      var queue = buildQueue(key);
      if(queue.length===0) return;
      st.queue = queue; st.idx=0; st.correct=0; st.wrong=[]; st.checked=false;
      st.phase="quiz";
      renderPage();
    });
  }
}

      '<div id="feedbackArea"></div>';
  } else if(item.type==="mc"){
    var d2 = item.data;
    var promptHtml = d2.q ? '<p class="prompt-sentence">'+escapeHtml(d2.q)+"</p>" :
      '<p class="prompt-sentence">'+escapeHtml(d2.sent).replace("___",'<span class="blank">______</span>')+"</p>";
    body =

        }).join("")+
      "</div>"+
      '<div id="feedbackArea"></div>';
  } else if(item.type==="phonetic"){
    var d3 = item.data;
    body =
      '<span class="pos-tag book-tag">'+T.unitLabel[d3.unit]+'</span>'+
      '<p class="prompt-sentence">Từ dưới đây chứa phiên âm nào?</p>'+
      '<p class="prompt-word">'+escapeHtml(d3.w)+"</p>"+
      '<div class="mc-list" id="mcList">'+
        item.opts.map(function(o,i){
          return '<button class="mc-opt" data-idx="'+i+'"><span class="letter">'+letters()[i]+".</span> /"+escapeHtml(o)+"/</button>";
        }).join("")+
      "</div>"+
      '<div id="feedbackArea"></div>';
  } else if(item.type==="translate"){
    var d4 = item.data;
    body =
      '<span class="pos-tag">Dịch câu</span>'+
      '<p class="prompt-vn">'+escapeHtml(d4.vn)+"</p>"+
      '<textarea class="text-input" id="answerInput" placeholder="Gõ bản dịch tiếng Anh của bạn…"></textarea>'+
      '<div class="btn-row"><button class="btn btn-primary" id="revealBtn">Xem đáp án mẫu</button></div>'+
      '<div id="feedbackArea"></div>';
  }

  return (
    '<h2 class="section-title">'+meta.label+"</h2>"+
    '<div class="progress-row">'+
      '<span class="progress-label">Câu '+(st.idx+1)+"/"+total+"</span>"+
      '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+
    "</div>"+
    body
  );
}

function feedbackHtml(isCorrect,answerText,explain,showSpeak){
  var head = isCorrect ? "✓ Chính xác!" : "✗ Chưa đúng";
  var cls = isCorrect ? "correct" : "incorrect";
  return (
    '<div class="feedback '+cls+'">'+
      '<div class="feedback-head">'+head+"</div>"+
      (answerText ? '<div class="feedback-answer">'+escapeHtml(answerText)+"</div>" : "")+
      '<div class="feedback-explain">'+explain+"</div>"+
      (showSpeak ? '<button class="speak-btn" id="speakBtn">🔊 Nghe cách đọc</button>' : "")+
      '<div class="btn-row"><button class="btn btn-primary" id="nextBtn">Câu tiếp theo →</button></div>'+
    "</div>"
  );
}

function bindQuiz(key){
  var st = sectionState[currentTest][key];
  var item = st.queue[st.idx];
  var testKeyAtBind = currentTest;

  function goNext(){
    st.idx++;
    st.checked=false;
    if(st.idx>=st.queue.length){ st.phase="summary"; st.done=true; renderTabs(); }
    renderPage();
  }
  function addScore(ok){
    var sc = testScore[testKeyAtBind];
    sc.total++; if(ok) sc.correct++;
    if(ok) st.correct++;
    updateScoreBadge();
  }

  if(item.type==="vocab"){
    var input = document.getElementById("answerInput");
    input.focus();
    var checkBtn = document.getElementById("checkBtn");
    function doCheck(){
      if(st.checked) return;
      st.checked = true;
      var d = item.data;
      var ok = vocabCorrect(input.value,d.en);
      input.disabled = true; checkBtn.disabled = true;
      if(!ok) st.wrong.push({q:d.vn,a:d.en[0]});
      addScore(ok);
      var fb = document.getElementById("feedbackArea");
      fb.innerHTML = feedbackHtml(ok, "Đáp án: "+d.en.join(" / "), buildVocabExplain(d,ok), true);
      document.getElementById("nextBtn").addEventListener("click",goNext);
      var sp = document.getElementById("speakBtn");
      if(sp) sp.addEventListener("click",function(){ speak(d.en[0]); });
    }
    checkBtn.addEventListener("click",doCheck);
    input.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); doCheck(); } });
  }

  if(item.type==="mc"){
    var list = document.getElementById("mcList");
    Array.prototype.forEach.call(list.querySelectorAll(".mc-opt"),function(btn){
      btn.addEventListener("click",function(){
        if(st.checked) return;
        st.checked = true;
        var idx = Number(btn.getAttribute("data-idx"));
        var d = item.data;
        var ok = idx===d.ans;
        if(!ok) st.wrong.push({q:(d.q||d.sent),a:d.opts[d.ans]});
        addScore(ok);
        Array.prototype.forEach.call(list.querySelectorAll(".mc-opt"),function(b,i){
          b.disabled = true;
          if(i===d.ans) b.classList.add("correct");
          else if(i===idx) b.classList.add("incorrect");
        });
        var explain = d.exp + (d.full ? '<br><br><span class="mono" style="opacity:.85">“'+escapeHtml(d.full)+'”</span>' : "");
        var fb = document.getElementById("feedbackArea");
        fb.innerHTML = feedbackHtml(ok, null, explain, false);
        document.getElementById("nextBtn").addEventListener("click",goNext);
      });
    });
  }

  if(item.type==="phonetic"){
    var list2 = document.getElementById("mcList");
    Array.prototype.forEach.call(list2.querySelectorAll(".mc-opt"),function(btn){
      btn.addEventListener("click",function(){
        if(st.checked) return;
        st.checked = true;
        var idx = Number(btn.getAttribute("data-idx"));
        var ok = idx===item.ans;
        var d = item.data;
        if(!ok) st.wrong.push({q:d.w,a:"/"+d.sym+"/"});
        addScore(ok);
        Array.prototype.forEach.call(list2.querySelectorAll(".mc-opt"),function(b,i){
          b.disabled = true;
          if(i===item.ans) b.classList.add("correct");
          else if(i===idx) b.classList.add("incorrect");
        });
        var fb = document.getElementById("feedbackArea");
        fb.innerHTML = feedbackHtml(ok, "/"+d.sym+"/", "Từ “"+d.w+"” chứa phiên âm trọng tâm /"+d.sym+"/ của "+CT().unitLabel[d.unit]+".", true);
        document.getElementById("nextBtn").addEventListener("click",goNext);
        var sp = document.getElementById("speakBtn");
        if(sp) sp.addEventListener("click",function(){ speak(d.w); });
      });
    });
  }

  if(item.type==="translate"){
    var ta = document.getElementById("answerInput");
    ta.focus();
    var revealBtn = document.getElementById("revealBtn");
    revealBtn.addEventListener("click",function(){
      if(st.checked) return;
      st.checked = true;
      var d = item.data;
      ta.disabled = true; revealBtn.disabled = true;
      var fb = document.getElementById("feedbackArea");
      fb.innerHTML =
        '<div class="feedback correct">'+
          '<div class="feedback-head">Đáp án mẫu</div>'+
          '<div class="feedback-answer">'+escapeHtml(d.en)+"</div>"+
          '<div class="feedback-explain">'+escapeHtml(d.note)+"</div>"+
          '<button class="speak-btn" id="speakBtn">🔊 Nghe câu mẫu</button>'+
          '<div class="btn-row">'+
            '<button class="btn btn-ghost" id="markWrong">Mình cần ôn lại câu này</button>'+
            '<button class="btn btn-primary" id="markRight">Mình đã dịch đúng ý</button>'+
          "</div>"+
        "</div>";
      document.getElementById("speakBtn").addEventListener("click",function(){ speak(d.en); });
      document.getElementById("markRight").addEventListener("click",function(){
        addScore(true); goNext();
      });
      document.getElementById("markWrong").addEventListener("click",function(){
        st.wrong.push({q:d.vn,a:d.en}); addScore(false); goNext();
      });
    });
  }
}

function buildVocabExplain(d,ok){
  var T = CT();
  var base = ok ? "Chuẩn rồi — nhớ kỹ nhé!" : "Chưa đúng, xem đáp án ở trên rồi ôn lại nha.";
  return base + ' Cụm này thuộc <b>'+T.bookLabel[d.book]+" — "+T.unitLabel[d.unit]+"</b>.";
}

/* ---------------- SUMMARY ---------------- */

function summaryHtml(key,meta,st){
  var total = st.queue.length;
  var list = st.wrong.length ?
    '<ul class="summary-list">'+st.wrong.map(function(w){
      return '<li class="summary-item">'+escapeHtml(w.q)+' → <b>'+escapeHtml(Array.isArray(w.a)?w.a[0]:w.a)+"</b></li>";
    }).join("")+"</ul>"
    : '<p class="summary-empty">Không sai câu nào — quá đỉnh!</p>';
  var allDone = isTestComplete(currentTest);
  var finalCta = allDone ?
    '<p class="all-done-note">🎉 Em đã hoàn thành tất cả 5 phần của '+CT().label+'!</p>'+
    '<div class="btn-row"><button class="btn btn-primary" id="goFinalBtn">Xem trang xác nhận hoàn thành →</button></div>'
    : "";
  return (
    '<h2 class="section-title">Hoàn thành: '+meta.label+"</h2>"+
    '<p class="summary-score">'+st.correct+" / "+total+" câu đúng</p>"+
    '<p class="section-desc">Những câu cần ôn lại:</p>'+
    list+
    '<div class="btn-row">'+
      '<button class="btn btn-primary" id="retryBtn">Làm lại phần này</button>'+
      '<button class="btn btn-ghost" id="setupBtn">Về trang tổng quan</button>'+
    "</div>"+
    finalCta
  );
}

function bindSummary(key){
  var st = sectionState[currentTest][key];
  document.getElementById("retryBtn").addEventListener("click",function(){
    var queue = buildQueue(key);
    st.queue=queue; st.idx=0; st.correct=0; st.wrong=[]; st.checked=false; st.phase="quiz";
    renderPage();
  });
  document.getElementById("setupBtn").addEventListener("click",function(){
    st.phase="setup"; renderPage();
  });
  var goFinalBtn = document.getElementById("goFinalBtn");
  if(goFinalBtn){
    goFinalBtn.addEventListener("click",function(){
      activeTab = "final";
      renderTabs();
      renderPage();
    });
  }
}

/* ---------------- FINAL COMPLETION PAGE ---------------- */

function finalHtml(){
  var T = CT();
  var totalCorrect = 0, totalCount = 0;
  var rows = SECTIONS.map(function(s){
    var st = sectionState[currentTest][s.key];
    var c = st.correct, n = st.queue.length;
    totalCorrect += c; totalCount += n;
    return (
      '<li class="cert-row"><span class="cert-check">✓</span>'+
      '<span class="cert-label">'+s.label+"</span>"+
      '<span class="cert-score mono">'+c+"/"+n+"</span></li>"
    );
  }).join("");
  var dateStr = new Date().toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric"});
  return (
    '<div class="cert">'+
      '<div class="cert-stamp">✓</div>'+
      '<p class="cert-eyebrow">Đã hoàn thành ôn tập</p>'+
      '<h2 class="cert-title">'+escapeHtml(T.label)+"</h2>"+
      '<p class="cert-sub">'+escapeHtml(T.subtitle)+"</p>"+
      '<label class="cert-name-label" for="studentName">Tên học sinh (để thầy dễ nhận ra trong ảnh chụp màn hình)</label>'+
      '<input type="text" class="text-input" id="studentName" placeholder="Nhập tên của em…" autocomplete="off">'+
      '<ul class="cert-list">'+rows+"</ul>"+
      '<p class="cert-total">Tổng: <b class="mono">'+totalCorrect+"/"+totalCount+"</b> câu đúng</p>"+
      '<p class="cert-date mono">'+dateStr+"</p>"+
      '<p class="cert-instruction">📸 Chụp màn hình trang này (có ghi tên của em) và gửi cho thầy Long để xác nhận đã ôn tập xong nhé!</p>'+
      '<div class="btn-row"><button class="btn btn-ghost" id="finalBackBtn">← Về trang chọn Test</button></div>'+
    "</div>"
  );
}

function bindFinal(){
  var back = document.getElementById("finalBackBtn");
  if(back){
    back.addEventListener("click",function(){
      currentTest = null;
      activeTab = "vocab";
      renderAll();
    });
  }
}

/* ---------------- INIT ---------------- */

renderAll();

})();
</script>
